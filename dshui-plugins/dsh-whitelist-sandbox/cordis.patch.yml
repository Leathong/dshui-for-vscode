# dsh-whitelist-sandbox bundle patch. The plugin is mounted as a PROFILE BUNDLE
# (`dsh.profile.bundles`), so this file is applied at the BUNDLE layer — BEFORE
# the profile's own `cordis.patch.yml` that the settings page edits — which is
# exactly what lets `configEditor` read and write this row's
# `extraWritableRoots` (an overlay row would be inserted after the settings
# document and every save would be refused).
#
# It owns the sandbox replacement atomically: disable the stock providers and
# insert the whitelist subclasses in one layer, so an unresolvable bundle is
# skipped whole (`loadProfileDirectory`) and the stock `shell`/`fs` providers
# survive. Default config (empty whitelist) behaves exactly like stock.
- id: bash-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- insert:
    - id: dsh-whitelist-sandbox
      name: dsh-whitelist-sandbox
