# dsh-whitelist-sandbox bundle patch: replaces the stock sandboxed bash
# executor and filesystem rows so the whitelist-aware subclasses that honor
# `extraWritableRoots` mount instead. The extension's root patch.yml is the
# operative overlay for the shipped setup and states the same rows (including
# the `extraWritableRoots` config); this file is the standalone bundle-patch
# used when mounted through a profile/bundle patch layer. Default config
# (empty whitelist) behaves exactly like stock.
- id: bash-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- insert:
    - id: dsh-whitelist-sandbox
      name: dsh-whitelist-sandbox
