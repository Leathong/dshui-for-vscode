# dshui overlay for the dsh web profile (passed via `dsh --patch`).
#
# Replaces the stock workspace browser and conversation plugins with the
# dshui builds, and mounts the dshui host plugin that registers the boot
# working directory (the VS Code workspace) as a durable dsh Workspace and
# publishes it to the browser as `window.__DSHUI_WORKSPACE__`.
#
# Patches cannot rename a row (a name mismatch is skipped), so the stock rows
# are disabled and fresh rows under the dshui package names are inserted. The
# bare package names resolve through `$DSH_HOME/profiles/node_modules`, which
# the extension populates on activation.
#
# Two invariants keep the client graph intact (dsh >= 0.1.7):
#   1. A row's id must equal the id its bundle declares with
#      `window.__ModuleLoader__.load({ id })` — the client-modules loader keys
#      factories by the declared id, so a stale build (bundles still declaring
#      `@deepseek-ai/dsh-client-ui-*`) leaves the row unloadable.
#   2. If that row fails, the `uiWorkspace` / `uiConversation` Cordis services
#      never appear, and the ~20 client plugins injecting them stay PENDING
#      forever — the browser then reports "Failed to load plugins" for almost
#      the whole UI. The builds behind `dshui-client-ui-*` must therefore come
#      from `pnpm run build:lib:client` after the tsdown `clientBundle(...)`
#      rename; `scripts/copy-clients.mjs` refuses to copy a mismatched bundle.
- id: ui-workspace
  disabled: true

- id: ui-conversation
  disabled: true

# The official per-turn change recorder is off: it snapshots the whole work tree
# twice per top-level turn and copies every file a file tool touches, to render a
# changed-files card this extension does not use — the sidebar "modification
# list" and the native VS Code diff come from `dsh-rollback-plugin` instead.
#
# The pairing is mandatory, not cosmetic: `workspace-changes` is the only provider
# of the `workspaceChanges` service, and the Host half of the stock
# `ui-deliverables` injects it. Disabling it alone leaves that entry PENDING
# forever, silently taking the present delivery cards, the authenticated native
# opens, the closing-message file mentions and the deliverable file-reference
# system-prompt section with it. The stub inserted below provides the same empty
# service; `scripts/verify-overlay.mjs` fails the build if either half is missing.
- id: workspace-changes
  disabled: true

# The sandbox seam is NOT overridden by this overlay. `bash-sandbox` /
# `fs-sandbox` are the only providers of the `shell` / `fs` services, and
# `dsh-whitelist-sandbox` replaces them with whitelist-aware subclasses. That
# replacement must be a PROFILE BUNDLE, not an overlay row: the settings page
# edits the row through `configEditor`, which writes the profile patch
# (layer 2), while `--patch` overlays are applied last (layer 4). A row inserted
# here is invisible at layer 2, so every settings save would be refused as
# "overridden by a home patch or command-line overlay".
#
# `installPlugins()`'s `ensureProfileBundle()` therefore lists
# `dsh-whitelist-sandbox` in the web profile's `dsh.profile.bundles`, and the
# package's own `cordis.patch.yml` (bundle layer 1) atomically disables
# `bash-sandbox` / `fs-sandbox` and inserts the whitelist row. Keeping the
# pairing in that one file means a missing package degrades to the stock
# sandbox — `loadProfileDirectory` skips an unresolvable bundle — instead of
# stripping `shell`/`fs` from the whole tree and leaving tool-bash, tool-fs,
# present, workflow-ptc, tool-workflow, permission, ptc-runtime,
# session-controller, workspace-files, ui-deliverables and our own
# rollback/scope rows PENDING forever. `scripts/verify-overlay.mjs` fails
# packaging when either half of that pairing is broken.

# The shared /api transport registers its channels on the connection row's
# fiber (`ctx.connection.rpc.handle` mounts the route via the fiber's
# webServer), but the stock row injects only webRuntime — a consumer mounting
# a channel (dsh-rollback-plugin) would fail at boot. Inject the
# server too; the loader mixes row inject with the module's own inject.
- id: connection
  name: '@deepseek-ai/dsh-client-connection'
  inject: [webRuntime, webServer]

- insert:
    - id: ui-workspace-dshui
      name: dshui-client-ui-workspace

    - id: ui-conversation-dshui
      name: dshui-client-ui-conversation

    - id: dshui-host-ensure-workspace
      name: dshui-host-ensure-workspace

    # Empty stand-in for the disabled `workspace-changes` row's
    # `workspaceChanges` service (see the pairing comment above).
    - id: dshui-workspace-changes-stub
      name: dshui-host-workspace-changes-stub

    - id: dsh-rollback-plugin
      name: dsh-rollback-plugin

    # Capability switches for skills, MCP servers, tools, prompt injections,
    # approvals and safety guards, at session / project / global level.
    # Third-party plugin shipped with the extension — source:
    # https://github.com/lifeopsgo/dsh-capability-toggle-plugin (MIT). It
    # succeeded `dsh-workspace-scope`, whose per-workspace skill / global-MCP
    # toggles it covers and widens. The row id below must stay equal to the id
    # the client bundle declares in `window.__ModuleLoader__.load` (invariant 1
    # above). Toggle state lives in the plugin's own storage domain, so this row
    # carries no config.
    - id: dsh-capability-toggle-plugin
      name: dsh-capability-toggle-plugin

    # Sandbox whitelist plugin: NOT inserted here — see the sandbox-seam
    # comment above. It is mounted as a profile bundle by
    # `ensureProfileBundle()`, so its own `cordis.patch.yml` owns the
    # disable-stock + insert-whitelist pairing. Operator roots live in the
    # `dsh-whitelist-sandbox` row of `$DSH_HOME/profiles/web/cordis.patch.yml`
    # (layer 2, after the bundles), editable from the settings page.

